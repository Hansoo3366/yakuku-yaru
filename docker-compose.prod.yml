services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-yakuku-yaru-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      API_PORT: 4000
      # KBO 크롤은 호스트 crontab(scripts/kbo-sync/*.sh)에서 실행. API 내장 cron은 기본 끔.
      KBO_SYNC_ENABLED: ${KBO_SYNC_ENABLED:-false}
      KBO_USER_AGENT: ${KBO_USER_AGENT:-}
      KBO_SYNC_WEEK_CRON: ${KBO_SYNC_WEEK_CRON:-0 6 * * *}
      KBO_SYNC_TODAY_CRON: ${KBO_SYNC_TODAY_CRON:-0 * * * *}
      KBO_SYNC_ON_START: ${KBO_SYNC_ON_START:-false}
      APP_URL: ${APP_URL:-}
      APP_DOMAIN: ${APP_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REMEMBER_EXPIRES_IN: ${JWT_REMEMBER_EXPIRES_IN:-30d}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: uploads
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    volumes:
      - ${UPLOADS_HOST_DIR:-api_uploads}:/app/apps/api/uploads

  web:
    image: ${WEB_IMAGE:-yakuku-yaru-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-contact@yakuku-yaru.today}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-contact@yakuku-yaru.today}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      - web
      - api
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run

  caddy:
    image: caddy:2.9-alpine
    profiles:
      - proxy
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  api_uploads:
  caddy_data:
  caddy_config:
