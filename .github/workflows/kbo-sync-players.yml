name: Sync KBO players (master)

on:
  schedule:
    # 매주 월요일 06:30 KST (일요일 21:30 UTC)
    - cron: '30 21 * * 0'
  workflow_dispatch:

jobs:
  sync:
    name: Weekly player master sync on production VM
    runs-on: ubuntu-latest
    steps:
      - name: Run full KBO player master sync in API container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
              npm run sync:kbo-players
