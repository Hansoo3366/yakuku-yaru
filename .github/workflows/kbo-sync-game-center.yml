name: Sync KBO game center (pitchers & lineups)

on:
  schedule:
    # 당일 선발·라인업 — KST 기준 (UTC = KST - 9h)
    - cron: '0 23 * * *'   # 08:00 KST — 오전 발표·정정
    - cron: '30 1 * * *'   # 10:30 KST
    - cron: '0 4 * * *'    # 13:00 KST — 점심 전후
    - cron: '30 6 * * *'   # 15:30 KST
    - cron: '0 8 * * *'    # 17:00 KST — 개막 전
    - cron: '30 9 * * *'   # 18:30 KST — 경기 시간대
    - cron: '0 11 * * *'   # 20:00 KST
    - cron: '30 12 * * *'  # 21:30 KST — 야간 경기
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode (today | week | month)'
        required: false
        default: today
        type: choice
        options:
          - today
          - week
          - month

jobs:
  sync:
    name: Game center sync on production VM
    runs-on: ubuntu-latest
    steps:
      - name: Run game-center sync in API container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            MODE="${{ github.event.inputs.mode || 'today' }}"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
              npm run sync:kbo-game-center -- --mode="$MODE"
