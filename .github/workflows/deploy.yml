name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: |
          test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST secret is missing" && exit 1)
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER secret is missing" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "DEPLOY_SSH_KEY secret is missing" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "DEPLOY_PATH secret is missing" && exit 1)
          test -n "$NEXT_PUBLIC_API_URL" || (echo "NEXT_PUBLIC_API_URL secret is missing" && exit 1)
          test -n "$NEXT_PUBLIC_CONTACT_EMAIL" || (
            echo "NEXT_PUBLIC_CONTACT_EMAIL repository variable is missing" && exit 1
          )
          echo "$DEPLOY_SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY' || (
            echo "DEPLOY_SSH_KEY must be a full PEM private key (BEGIN/END lines)" && exit 1
          )
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
          echo "Deploy key fingerprint (서버 authorized_keys와 일치해야 함):"
          ssh-keygen -lf /tmp/deploy_key.pub
          rm -f /tmp/deploy_key /tmp/deploy_key.pub

      - name: Prepare image names
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=ghcr.io/${OWNER_LC}/yakuku-yaru-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${OWNER_LC}/yakuku-yaru-web:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "API_IMAGE_LATEST=ghcr.io/${OWNER_LC}/yakuku-yaru-api:latest" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_LATEST=ghcr.io/${OWNER_LC}/yakuku-yaru-web:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}
            ${{ env.API_IMAGE_LATEST }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}
            ${{ env.WEB_IMAGE_LATEST }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 30m
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            if [ -n "${{ secrets.DEPLOY_COMPOSE_PROFILES }}" ]; then
              export COMPOSE_PROFILES="${{ secrets.DEPLOY_COMPOSE_PROFILES }}"
            fi
            git fetch origin main
            git reset --hard origin/main
            export API_IMAGE="${{ env.API_IMAGE }}"
            export WEB_IMAGE="${{ env.WEB_IMAGE }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker container prune -f
            docker image prune -af
            docker builder prune -af
            docker compose -f docker-compose.prod.yml --env-file .env.production pull api web
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build
            docker image prune -f
