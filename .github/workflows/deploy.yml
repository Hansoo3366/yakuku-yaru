name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # 이미지 빌드는 검사와 동시에 돌린다. 배포는 둘 다 성공해야 시작한다.
  build:
    name: Build Images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      web_image: ${{ steps.names.outputs.web_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: |
          test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST secret is missing" && exit 1)
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER secret is missing" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "DEPLOY_SSH_KEY secret is missing" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "DEPLOY_PATH secret is missing" && exit 1)
          test -n "$NEXT_PUBLIC_API_URL" || (echo "NEXT_PUBLIC_API_URL secret is missing" && exit 1)
          test -n "$NEXT_PUBLIC_CONTACT_EMAIL" || (
            echo "NEXT_PUBLIC_CONTACT_EMAIL repository variable is missing" && exit 1
          )
          echo "$DEPLOY_SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY' || (
            echo "DEPLOY_SSH_KEY must be a full PEM private key (BEGIN/END lines)" && exit 1
          )
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
          echo "Deploy key fingerprint (서버 authorized_keys와 일치해야 함):"
          ssh-keygen -lf /tmp/deploy_key.pub
          rm -f /tmp/deploy_key /tmp/deploy_key.pub

      - name: Prepare image names
        id: names
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          API_IMAGE="ghcr.io/${OWNER_LC}/yakuku-yaru-api:${GITHUB_SHA}"
          WEB_IMAGE="ghcr.io/${OWNER_LC}/yakuku-yaru-web:${GITHUB_SHA}"
          echo "API_IMAGE=${API_IMAGE}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE}" >> "$GITHUB_ENV"
          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "web_image=${WEB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ${{ needs.build.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 검사를 통과한 이미지에만 latest 를 붙인다.
      - name: Tag images as latest
        run: |
          docker buildx imagetools create -t "${API_IMAGE%:*}:latest" "$API_IMAGE"
          docker buildx imagetools create -t "${WEB_IMAGE%:*}:latest" "$WEB_IMAGE"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 30m
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            export API_IMAGE="${{ env.API_IMAGE }}"
            export SENTRY_RELEASE="${{ github.sha }}"
            export WEB_IMAGE="${{ env.WEB_IMAGE }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.production pull api web
            docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy up -d --no-build
            docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy up -d --no-build --force-recreate gateway
            docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy exec -T gateway nginx -t
            docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            healthy=0
            for attempt in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy exec -T gateway wget -qO- http://127.0.0.1:8080/api/health; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1
            swagger_ready=0
            for attempt in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy exec -T gateway wget -qO- http://127.0.0.1:8080/api-docs.json > /dev/null; then
                swagger_ready=1
                break
              fi
              sleep 5
            done
            test "$swagger_ready" = 1
            # 새 버전이 뜬 뒤에 이전 이미지를 정리한다. (배포 전에 지우면 공통 레이어까지 다시 받게 된다)
            docker container prune -f
            docker image prune -af
