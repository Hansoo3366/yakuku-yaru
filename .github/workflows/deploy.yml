name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # 이미지 빌드는 검사와 동시에 돌린다. 배포는 둘 다 성공해야 시작한다.
  build:
    name: Build Images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      web_image: ${{ steps.names.outputs.web_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate deployment secrets
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: |
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER secret is missing" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "DEPLOY_SSH_KEY secret is missing" && exit 1)
          test -n "$NEXT_PUBLIC_API_URL" || (echo "NEXT_PUBLIC_API_URL secret is missing" && exit 1)
          test -n "$NEXT_PUBLIC_CONTACT_EMAIL" || (
            echo "NEXT_PUBLIC_CONTACT_EMAIL repository variable is missing" && exit 1
          )
          echo "$DEPLOY_SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY' || (
            echo "DEPLOY_SSH_KEY must be a full PEM private key (BEGIN/END lines)" && exit 1
          )
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
          echo "Deploy key fingerprint (서버 authorized_keys와 일치해야 함):"
          ssh-keygen -lf /tmp/deploy_key.pub
          rm -f /tmp/deploy_key /tmp/deploy_key.pub

      - name: Prepare image names
        id: names
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          API_IMAGE="ghcr.io/${OWNER_LC}/yakuku-yaru-api:${GITHUB_SHA}"
          WEB_IMAGE="ghcr.io/${OWNER_LC}/yakuku-yaru-web:${GITHUB_SHA}"
          echo "API_IMAGE=${API_IMAGE}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE}" >> "$GITHUB_ENV"
          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "web_image=${WEB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Workload Identity 로 GCP 에 로그인하려면 OIDC 토큰이 필요하다.
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      API_IMAGE: ${{ needs.build.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image }}
      GCP_INSTANCE: instance-20260521-045939
      GCP_ZONE: us-central1-a
      # 서버 SSH 호스트 키. VM 을 새로 만들면 /etc/ssh/ssh_host_ed25519_key.pub 값으로 바꾼다.
      DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIY/FBSk0lOo+Mz09fZwjdtXpGIoJJqHfLCm9+hPNvKw
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 검사를 통과한 이미지에만 latest 를 붙인다.
      - name: Tag images as latest
        run: |
          docker buildx imagetools create -t "${API_IMAGE%:*}:latest" "$API_IMAGE"
          docker buildx imagetools create -t "${WEB_IMAGE%:*}:latest" "$WEB_IMAGE"

      # 서버의 SSH 는 IAP 대역에만 열려 있다. 키 파일 없이 이 저장소의 main 에서만 로그인된다.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/409994051730/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@yakuku-yaru.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Open IAP tunnel
        run: |
          gcloud compute start-iap-tunnel "$GCP_INSTANCE" 22 \
            --zone="$GCP_ZONE" --local-host-port=localhost:2222 > /tmp/iap-tunnel.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iap-tunnel.log
          exit 1

      - name: Deploy with Docker Compose
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'yakuku-prod %s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # 서버의 deploy 키는 /usr/local/bin/yakuku-deploy 만 실행할 수 있다 (scripts/deploy/yakuku-deploy).
          # 보낼 수 있는 것은 커밋 SHA 와 GitHub 사용자뿐이고, stdin 은 ghcr 토큰 한 줄이다.
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key -p 2222 \
            -o HostKeyAlias=yakuku-prod -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@localhost" \
            "deploy $GITHUB_SHA $GITHUB_ACTOR" \
            | tee "$RUNNER_TEMP/deploy.log"
          # 스크립트가 중간에 조용히 끝나도 ssh 는 성공으로 끝날 수 있어, 마지막 표시까지 확인한다.
          grep -qx "DEPLOY_OK $GITHUB_SHA" "$RUNNER_TEMP/deploy.log"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
