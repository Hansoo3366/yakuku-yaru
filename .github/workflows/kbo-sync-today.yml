name: Sync KBO schedule (today)

on:
  schedule:
    # 매시간 (UTC 기준; 컨테이너 TZ=Asia/Seoul)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Today hourly sync on production VM
    runs-on: ubuntu-latest
    steps:
      - name: Run today-mode sync in API container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
              npm run sync:kbo-schedule -- --mode=today
