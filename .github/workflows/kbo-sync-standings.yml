name: Sync KBO team standings

on:
  schedule:
    # 매일 06:30 KST (21:30 UTC) — 일정 동기화 직후
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Daily team standings on production VM
    runs-on: ubuntu-latest
    steps:
      - name: Run standings sync in API container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
              npm run sync:kbo-standings
