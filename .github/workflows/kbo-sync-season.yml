name: Sync KBO schedule (season)

on:
  schedule:
    # 매년 3월 1일 06:00 KST (2/28 21:00 UTC, 윤년은 수동 보정 가능)
    - cron: '0 21 1 3 *'
  workflow_dispatch:

jobs:
  sync:
    name: Full season year sync on production VM
    runs-on: ubuntu-latest
    steps:
      - name: Run season-mode sync in API container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
              npm run sync:kbo-schedule -- --mode=season
