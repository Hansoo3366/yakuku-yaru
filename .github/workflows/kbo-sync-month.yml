name: Sync KBO schedule (month)

on:
  schedule:
    # 매월 1일 06:00 KST (전날 21:00 UTC)
    - cron: '0 21 1 * *'
  workflow_dispatch:

jobs:
  sync:
    name: Current month sync on production VM
    runs-on: ubuntu-latest
    steps:
      - name: Run month-mode sync in API container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
              npm run sync:kbo-schedule -- --mode=month
