services:
  mysql:
    image: mysql:8.4
    container_name: yakuku-yaru-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yakuku_yaru}
      MYSQL_USER: ${MYSQL_USER:-yakuku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yakuku_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
